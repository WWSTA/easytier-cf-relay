# EasyTier Cloudflare Relay — Durable Object 配置
# 完整变量说明见《部署手册》

name = "easytier-cf-relay"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# WebSocket Hibernation 需要的最低兼容日期为 2024-04-03

[vars]
# WebSocket 路径：接受任意路径的升级请求（与官方服务端行为一致），
# 客户端 -p 直接使用 wss://<域名> 即可；/health 与 /metrics 保留
# 服务端虚拟 Peer ID（避免与客户端随机 Peer ID 冲突，可用 env 覆盖）
SERVER_PEER_ID = "10000001"
# 服务端在握手响应中宣告的网络名（与客户端网络名不同 => 外部网络中继模式）
SERVER_NETWORK_NAME = "public_server"
SERVER_HOSTNAME = "easytier-cf-relay"
SERVER_VERSION_STR = "easytier-cf-relay/1.6.0"
# 指定 Durable Object 地区配置（可选值：wnam 西部地区（北美）enam 东部地区（北美）sam 南美洲 weur 西欧 eeur 东欧 apac	亚太地区（已设置，默认未开启） oc 大洋洲 afr 非洲 me 中东）
# LOCATION_HINT = "apac"
# 纯 P2P 模式：1 = 在 feature_flag 中宣告 avoid_relay_data（OSPF 给本节点边赋大代价，
# 客户端优先直连 P2P，中继仅作兜底）；0 = 不宣告
AVOID_RELAY_DATA = "1"
# 是否继续转发 Data/KCP 数据包（P2P 失败时的兜底通道）：1 = 转发；0 = 丢弃（严格纯 P2P）
RELAY_DATA = "1"
# 同一房间最大 peer 数
MAX_PEERS_PER_ROOM = "128"
# 单 IP 并发连接上限（v1.4.1，事前限流）：防单 IP 用普通握手占满房间；
# 仅 DO 升级层权威检查；同 NAT 多节点共享出口 IP，默认 6；0 = 关闭
MAX_CONNS_PER_IP = "6"
# 未知路径 tar pit（v1.4.1）：非升级请求访问未知路径时挂起不响应
# （不返回 404，不泄露行为指纹，让扫描器空等）；EasyTier 客户端只走
# WS 升级，不受影响；0 = 关闭（恢复 404）
TARPIT_UNKNOWN = "1"
# 单连接消息速率上限（v1.5，事前限流）：每连接每秒最大消息数，持续超限断开
# （4008）；EasyTier 心跳 8s 1 个、路由同步爆发每秒数十个，默认 50 宽裕；0 = 关闭
MSG_RATE_LIMIT_PER_SEC = "50"
# 每分组 peer 上限（v1.5）：单个网络分组的在线节点数上限，防单网络占满房间；
# 0 = 不限（仅受 MAX_PEERS_PER_ROOM 约束）
MAX_PEERS_PER_GROUP = "32"
# 单条 WS 消息最大字节数（EasyTier MTU 默认 1380，RPC 路由同步会更大）
MAX_MESSAGE_BYTES = "131072"
# 未握手连接超时（毫秒）—— 幽灵连接清理
HANDSHAKE_TIMEOUT_MS = "15000"
# 空闲超时（毫秒）。必须大于客户端 ping 最大间隔 32s
PEER_IDLE_TIMEOUT_MS = "75000"
# 服务端主动 ping 阈值（毫秒）：空闲超过该值发送 Ping 探活
SERVER_PING_IDLE_MS = "40000"
# 清扫周期（毫秒），alarm 按自适应排程唤醒 DO（有连接时至多该周期一次）
SWEEP_INTERVAL_MS = "15000"
# 空闲退避（毫秒）：房间无连接且无脏数据时 alarm 退避到该间隔（默认 5 分钟），
# 空房间消耗从 5760 请求/天降至 288；0 = 关闭（退回 SWEEP_INTERVAL_MS）
SWEEP_IDLE_INTERVAL_MS = "300000"
# 摘要策略：1 = 同一网络名出现不同摘要时拒绝（默认，防抢占/防嗅探）；0 = 隔离为不同分组
STRICT_DIGEST = "1"
# 幽灵节点老化（对齐官方 clear_expired_peer）：
# - ROUTE_INFO_UNREACHABLE_MS：条目未刷新且节点不可达超过该时长 → 删除（默认 90000）
# - ROUTE_INFO_TTL_MS：条目未刷新超过该时长 → 无条件删除（默认 3660000）
ROUTE_INFO_UNREACHABLE_MS = "90000"
ROUTE_INFO_TTL_MS = "3660000"
# 空分组自动删除宽限（毫秒）：分组内在线节点归零后持续该时长仍为空 →
# 整组删除（含路由条目与摘要注册）；0 = 关闭。默认 60000
GROUP_AUTO_DELETE_MS = "60000"
# 日志级别：debug | info | warn | error
LOG_LEVEL = "info"
# ---------------------------------------------------------------------------
# KV 审计（记录 + 黑名单）。需要先创建 KV namespace 并取消下方注释：
#   npx wrangler kv namespace create AUDIT_KV
# 不配置 AUDIT_KV 绑定时功能优雅降级：记录/黑名单仅存 Durable Object storage。
# ---------------------------------------------------------------------------
# 每类信息只占一条 KV 键（记录 7 条 + 黑名单 4 条，共 11 条）：
#   记录键   et-relay:rec:<groups|peers|routes|peercenter|sockets|digests|admin>
#   黑名单键 et-relay:bl:<peer|group|digest|socket>
# KV 镜像最小间隔（毫秒）：事件先入内存+DO storage，按此间隔节流写 KV。
# 免费额度 1000 写/天：默认 10 分钟间隔下每键最多 144 写/天
RECORD_FLUSH_MS = "600000"
# 各类记录默认条数上限（管理页可单独调整）
RECORD_DEFAULT_LIMIT = "100"
# 各类黑名单条数上限（硬设置）
BLACKLIST_LIMIT = "1000"
# 管理端审计硬开关：记录管理员登录（IP/时间）、操作、查看信息。
# 这是硬设置 —— 管理页无法关闭 admin 类记录，也无法删除其内容
ADMIN_AUDIT = "1"
ADMIN_AUDIT_LIMIT = "200"
# 边缘层 IP 黑名单缓存（毫秒）：isolate 内缓存 bl:socket 的 KV 读结果，
# 重连风暴时 KV 读从每次连接 1 次降为每 TTL 1 次。只延后拦截、绝不漏放
# （缓存未命中照旧放行走 DO 权威检查）。0 = 关闭
IP_BLOCK_CACHE_MS = "30000"
# 可选：JSON 映射 {"网络名":"网络密钥"}，配置后服务端校验客户端摘要（SipHash-1-3）
# NETWORK_SECRETS = "{\"default\":\"my-secret\"}"
# 可选：DO 房间分片。默认单一房间 "global"；配置后可按 Header/Query 切分房间
# ROOM_ID = "global"
# ROOM_HEADER = "X-Room"
# ROOM_QUERY = "room"

# ---------------------------------------------------------------------------
# 监控与管理端（生产环境默认全部禁用 —— 不配置即 404，零攻击面）
# 启用时务必使用随机长路径 + 强 token（两道防线），参考部署手册「监控与管理端」章节
# ---------------------------------------------------------------------------
# 统计端点：自定义安全路径（不配置则 /metrics 完全禁用）
# METRICS_PATH = "/m-please-change-me"
# 统计端点 token（与 METRICS_PATH 同时配置才启用；支持 Bearer 头或 ?token= 参数）
# METRICS_TOKEN = "please-change-me-to-a-long-random-string"
# 健康检查路径（默认 /health）。配置后仅该路径返回 {"ok":true}，原 /health 返回 404（防指纹扫描，无需 token）
# HEALTH_PATH = "/health"
# Web 管理端路径（需与 ADMIN_TOKEN 同时配置才启用；页面壳公开、数据 API 鉴权）
# ADMIN_PATH = "/admin-please-change-me"
# 管理端 token（状态查看 / 踢出节点 / 删除分组）
# ⚠️ 安全建议：token 属敏感信息，生产环境建议用
#   npx wrangler secret put ADMIN_TOKEN
# 注入而非写在本文件明文（与 CF_API_TOKEN 同模式）；本文件可能随仓库/备份/截图外泄
# ADMIN_TOKEN = "please-change-me-to-another-long-random-string"
# ---------------------------------------------------------------------------
# 账号级真实额度 + AE 趋势（v1.6，全部可选 —— 不配置则管理页回退自观测估算）
# ---------------------------------------------------------------------------
# Cloudflare 账号 ID（Dashboard 右侧 / Workers 概览页可见，非敏感）
# CF_ACCOUNT_ID = "your-cloudflare-account-id"
# Cloudflare API Token：必须用 secret 注入，绝不写入本文件明文！
#   npx wrangler secret put CF_API_TOKEN
#   权限只给「Account Analytics: Read」（供 GraphQL 额度查询与 AE SQL 趋势查询共用），
#   可随时在 Dashboard 吊销。见部署手册「额度观测与趋势」章节
# 查询的 Worker 脚本名（默认 easytier-cf-relay；改名部署时需同步）
# CF_SCRIPT_NAME = "easytier-cf-relay"

[durable_objects]
bindings = [
  { name = "RELAY_ROOM", class_name = "RelayRoom" }
]

# KV 审计绑定（记录 + 黑名单）。创建后取消注释并填入 id：
#   npx wrangler kv namespace create AUDIT_KV
# [[kv_namespaces]]
# binding = "AUDIT_KV"
# id = "<你的 KV namespace id>"
# Analytics Engine 绑定（v1.6：趋势打点，免费计划含 100,000 数据点/天；
# 本方案每分钟 1 点 ≈ 1,440/天）。绑定即自动建数据集，无需额外创建步骤
# ⚠️ 注意：本绑定要求账号先在 Dashboard 一次性开通 Analytics Engine
#   （Workers & Pages → Analytics Engine → Enable，免费、无需绑卡）；
#   未开通时 `wrangler deploy` 会报错 10089「You need to enable Analytics
#   Engine」，整个部署失败（线上不受影响，开通后重跑即可）。不需要趋势图
#   可注释掉下面 3 行——代码自动降级，其余功能不受影响。
# 打开 https://dash.cloudflare.com/{CF_ACCOUNT_ID}/workers/analytics-engine
# [[analytics_engine_datasets]]
# binding = "AE"
# dataset = "easytier-cf-relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]

# 说明：
# - 使用 new_sqlite_classes（存储后端为 SQLite，免费额度内即支持 Hibernation API）
# - 若已有旧部署（new_classes），不要重复添加迁移，参考部署手册"迁移"章节
